<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOIDSTRIKE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --neon-cyan: #00ffff;
    --neon-pink: #ff006e;
    --neon-yellow: #ffee00;
    --dark: #040810;
    --mid: #0a1628;
    --grid: rgba(0,255,255,0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--neon-cyan);
    font-family: 'Share Tech Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  #title-screen, #game-over-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    background: rgba(4,8,16,0.92);
  }

  #title-screen h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 900;
    color: var(--neon-cyan);
    text-shadow: 0 0 20px var(--neon-cyan), 0 0 60px var(--neon-cyan), 0 0 120px rgba(0,255,255,0.3);
    letter-spacing: 0.15em;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .subtitle {
    color: var(--neon-pink);
    font-size: 0.85rem;
    letter-spacing: 0.4em;
    margin: 1rem 0 3rem;
    text-shadow: 0 0 10px var(--neon-pink);
  }

  .instructions {
    color: rgba(0,255,255,0.6);
    font-size: 0.75rem;
    line-height: 2.2;
    text-align: center;
    letter-spacing: 0.05em;
    margin-bottom: 2.5rem;
  }

  .start-btn {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.2em;
    padding: 1rem 3rem;
    background: transparent;
    color: var(--neon-cyan);
    border: 2px solid var(--neon-cyan);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
    box-shadow: 0 0 20px rgba(0,255,255,0.3), inset 0 0 20px rgba(0,255,255,0.05);
  }

  .start-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--neon-cyan);
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    z-index: -1;
  }

  .start-btn:hover::before { transform: translateX(0); }
  .start-btn:hover { color: var(--dark); box-shadow: 0 0 40px rgba(0,255,255,0.6); }

  #wrapper {
    position: relative;
    z-index: 1;
  }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 600px;
    padding: 0.5rem 0.75rem;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
  }

  .hud-val {
    color: var(--neon-cyan);
    text-shadow: 0 0 8px var(--neon-cyan);
  }

  .hud-label { color: rgba(0,255,255,0.4); font-size: 0.6rem; display: block; }

  #lives-display { display: flex; gap: 6px; }
  .life-icon { color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); font-size: 1.1rem; }

  canvas {
    display: block;
    border: 1px solid rgba(0,255,255,0.15);
    box-shadow:
      0 0 0 1px rgba(0,255,255,0.05),
      0 0 40px rgba(0,255,255,0.08),
      inset 0 0 40px rgba(0,0,0,0.5);
    background: var(--dark);
  }

  #game-over-screen h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 900;
    color: var(--neon-pink);
    text-shadow: 0 0 20px var(--neon-pink), 0 0 60px var(--neon-pink);
    letter-spacing: 0.1em;
    margin-bottom: 1rem;
  }

  .final-score {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    color: var(--neon-yellow);
    text-shadow: 0 0 12px var(--neon-yellow);
    margin-bottom: 0.5rem;
    letter-spacing: 0.15em;
  }

  .wave-reached {
    color: rgba(0,255,255,0.6);
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    margin-bottom: 2.5rem;
  }

  .mobile-controls {
    display: none;
    gap: 12px;
    margin-top: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  @media (max-width: 700px) or (pointer: coarse) {
    .mobile-controls { display: flex; }
    .instructions .kb { display: none; }
  }

  .mob-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.8rem 1.4rem;
    background: rgba(0,255,255,0.05);
    color: var(--neon-cyan);
    border: 1px solid rgba(0,255,255,0.3);
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.1em;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s, border-color 0.1s;
  }

  .mob-btn:active, .mob-btn.pressed {
    background: rgba(0,255,255,0.18);
    border-color: var(--neon-cyan);
  }

  #mob-fire {
    color: var(--neon-pink);
    border-color: rgba(255,0,110,0.4);
    background: rgba(255,0,110,0.05);
  }
  #mob-fire:active, #mob-fire.pressed {
    background: rgba(255,0,110,0.18);
    border-color: var(--neon-pink);
  }
</style>
</head>
<body>

<div id="title-screen">
  <h1>VOIDSTRIKE</h1>
  <div class="subtitle">▸ DEEP SPACE DEFENSE ◂</div>
  <div class="instructions">
    <span class="kb">← → ARROW KEYS &nbsp;|&nbsp; MOVE<br>SPACE &nbsp;|&nbsp; FIRE<br><br></span>
    SURVIVE THE WAVES<br>
    ENEMIES ACCELERATE EACH WAVE<br>
    DON'T LET THEM REACH THE BOTTOM
  </div>
  <button class="start-btn" id="start-btn">LAUNCH MISSION</button>
</div>

<div id="wrapper">
  <div id="hud">
    <div>
      <span class="hud-label">SCORE</span>
      <span class="hud-val" id="score-display">000000</span>
    </div>
    <div style="text-align:center">
      <span class="hud-label">WAVE</span>
      <span class="hud-val" id="wave-display">01</span>
    </div>
    <div style="text-align:right">
      <span class="hud-label">SHIELDS</span>
      <div id="lives-display"></div>
    </div>
  </div>
  <canvas id="c" width="600" height="480"></canvas>
  <div class="mobile-controls">
    <button class="mob-btn" id="mob-left">◀ LEFT</button>
    <button class="mob-btn" id="mob-fire">● FIRE</button>
    <button class="mob-btn" id="mob-right">RIGHT ▶</button>
  </div>
</div>

<div id="game-over-screen" style="display:none">
  <h2>SYSTEM FAILURE</h2>
  <div class="final-score" id="final-score">SCORE: 000000</div>
  <div class="wave-reached" id="wave-reached">WAVE 01 REACHED</div>
  <button class="start-btn" id="restart-btn">RESTART MISSION</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// --- State ---
let score, wave, lives, gameRunning, animId;
let player, bullets, enemies, enemyBullets, particles, explosions;
let keys = {};
let shootCooldown = 0;
let enemyDir = 1, enemyDropPending = false;
let enemyShootTimer = 0;
let waveTransition = false, waveTimer = 0;
const WAVE_PAUSE = 120;

// Mobile
let mobState = { left: false, right: false, fire: false };

function setupMobile() {
  const addTouch = (el, key) => {
    el.addEventListener('touchstart', e => { e.preventDefault(); mobState[key] = true; el.classList.add('pressed'); }, { passive: false });
    el.addEventListener('touchend', e => { e.preventDefault(); mobState[key] = false; el.classList.remove('pressed'); }, { passive: false });
    el.addEventListener('mousedown', () => { mobState[key] = true; el.classList.add('pressed'); });
    el.addEventListener('mouseup', () => { mobState[key] = false; el.classList.remove('pressed'); });
  };
  addTouch(document.getElementById('mob-left'), 'left');
  addTouch(document.getElementById('mob-right'), 'right');
  addTouch(document.getElementById('mob-fire'), 'fire');
}

// --- Init ---
function initGame() {
  score = 0; wave = 1; lives = 3;
  player = { x: W / 2, y: H - 50, w: 32, h: 20, speed: 4 };
  bullets = []; enemyBullets = []; enemies = []; particles = []; explosions = [];
  shootCooldown = 0; enemyDir = 1; waveTransition = false;
  spawnWave();
  updateHUD();
}

function spawnWave() {
  enemies = [];
  const cols = 10, rows = Math.min(3 + Math.floor(wave / 2), 5);
  const xOff = (W - cols * 48) / 2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      enemies.push({
        x: xOff + c * 48 + 16,
        y: 50 + r * 36,
        w: 24, h: 16,
        type: r === 0 ? 2 : r <= 1 ? 1 : 0,
        alive: true,
        frame: Math.random() < 0.5 ? 0 : 1,
        frameTimer: Math.floor(Math.random() * 40)
      });
    }
  }
  enemyDir = 1;
  enemyShootTimer = 0;
}

function updateHUD() {
  document.getElementById('score-display').textContent = String(score).padStart(6, '0');
  document.getElementById('wave-display').textContent = String(wave).padStart(2, '0');
  const ld = document.getElementById('lives-display');
  ld.innerHTML = '';
  for (let i = 0; i < lives; i++) {
    const s = document.createElement('span');
    s.className = 'life-icon'; s.textContent = '▲';
    ld.appendChild(s);
  }
}

// --- Particles ---
function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd, life: 1, color, size: 2 + Math.random() * 2 });
  }
}

function spawnExplosion(x, y, color) {
  explosions.push({ x, y, r: 0, maxR: 30 + Math.random() * 20, color, alpha: 1 });
}

// --- Drawing ---
function drawPlayer(p) {
  ctx.save();
  // Ship body
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#00ffff';
  ctx.beginPath();
  ctx.moveTo(p.x, p.y - p.h / 2);
  ctx.lineTo(p.x - p.w / 2, p.y + p.h / 2);
  ctx.lineTo(p.x - p.w / 4, p.y + p.h / 4);
  ctx.lineTo(p.x, p.y + p.h / 2 - 4);
  ctx.lineTo(p.x + p.w / 4, p.y + p.h / 4);
  ctx.lineTo(p.x + p.w / 2, p.y + p.h / 2);
  ctx.closePath();
  ctx.fill();
  // Cockpit
  ctx.fillStyle = '#040810';
  ctx.beginPath();
  ctx.arc(p.x, p.y - 2, 5, 0, Math.PI * 2);
  ctx.fill();
  // Engine glow
  ctx.shadowColor = '#ff006e';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#ff006e';
  ctx.fillRect(p.x - 5, p.y + p.h / 2, 10, 3 + Math.sin(Date.now() / 80) * 2);
  ctx.restore();
}

function drawEnemy(e) {
  if (!e.alive) return;
  ctx.save();
  const colors = ['#ff006e', '#ffee00', '#00ffff'];
  const c = colors[e.type];
  ctx.shadowColor = c;
  ctx.shadowBlur = 12;
  ctx.fillStyle = c;

  if (e.type === 2) {
    // Angular elite enemy
    ctx.beginPath();
    ctx.moveTo(e.x, e.y - e.h / 2);
    ctx.lineTo(e.x + e.w / 2, e.y);
    ctx.lineTo(e.x + e.w / 3, e.y + e.h / 2);
    ctx.lineTo(e.x - e.w / 3, e.y + e.h / 2);
    ctx.lineTo(e.x - e.w / 2, e.y);
    ctx.closePath();
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#040810';
    ctx.fillRect(e.x - 5, e.y - 2, 4, 4);
    ctx.fillRect(e.x + 1, e.y - 2, 4, 4);
  } else if (e.type === 1) {
    // Mid enemy - crab-like
    ctx.beginPath();
    ctx.moveTo(e.x - e.w / 2, e.y + e.h / 2);
    ctx.lineTo(e.x - e.w / 2, e.y);
    ctx.lineTo(e.x - e.w / 4, e.y - e.h / 2);
    ctx.lineTo(e.x + e.w / 4, e.y - e.h / 2);
    ctx.lineTo(e.x + e.w / 2, e.y);
    ctx.lineTo(e.x + e.w / 2, e.y + e.h / 2);
    ctx.closePath();
    ctx.fill();
    const legX = e.frame === 0 ? 2 : -2;
    ctx.fillRect(e.x - e.w / 2 - 6 + legX, e.y + 2, 6, 3);
    ctx.fillRect(e.x + e.w / 2 - legX, e.y + 2, 6, 3);
  } else {
    // Basic squid
    ctx.beginPath();
    ctx.arc(e.x, e.y - 4, e.w / 2.5, Math.PI, 0);
    ctx.lineTo(e.x + e.w / 2, e.y + e.h / 2);
    const tentW = e.w / 4;
    const off = e.frame === 0 ? 2 : -2;
    ctx.lineTo(e.x + tentW + off, e.y + 2);
    ctx.lineTo(e.x + tentW + off, e.y + e.h / 2);
    ctx.lineTo(e.x, e.y + 2);
    ctx.lineTo(e.x - tentW - off, e.y + e.h / 2);
    ctx.lineTo(e.x - tentW - off, e.y + 2);
    ctx.lineTo(e.x - e.w / 2, e.y + e.h / 2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawBullet(b, color) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 12;
  ctx.fillStyle = color;
  ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
  ctx.restore();
}

// --- Update ---
function update() {
  if (!gameRunning) return;

  // Wave transition pause
  if (waveTransition) {
    waveTimer--;
    if (waveTimer <= 0) {
      waveTransition = false;
      wave++;
      spawnWave();
      updateHUD();
    }
    updateParticles();
    return;
  }

  // Player movement
  const leftKey = keys['ArrowLeft'] || keys['a'] || keys['A'] || mobState.left;
  const rightKey = keys['ArrowRight'] || keys['d'] || keys['D'] || mobState.right;
  if (leftKey) player.x = Math.max(player.w / 2 + 4, player.x - player.speed);
  if (rightKey) player.x = Math.min(W - player.w / 2 - 4, player.x + player.speed);

  // Shooting
  shootCooldown--;
  if ((keys[' '] || keys['ArrowUp'] || mobState.fire) && shootCooldown <= 0) {
    bullets.push({ x: player.x, y: player.y - player.h / 2, vy: -10 });
    shootCooldown = 18;
  }

  // Move bullets
  bullets = bullets.filter(b => {
    b.y += b.vy;
    return b.y > -10;
  });

  // Move enemy bullets
  enemyBullets = enemyBullets.filter(b => {
    b.y += b.vy;
    return b.y < H + 10;
  });

  // Enemy movement
  const aliveEnemies = enemies.filter(e => e.alive);
  if (aliveEnemies.length === 0) {
    waveTransition = true;
    waveTimer = WAVE_PAUSE;
    return;
  }

  const waveSpeedMult = 1 + (wave - 1) * 0.18;
  const spd = (0.5 + (1 - aliveEnemies.length / (enemies.length || 1)) * 0.8) * waveSpeedMult;

  let hitWall = false;
  for (const e of aliveEnemies) {
    e.x += spd * enemyDir;
    e.frameTimer++;
    if (e.frameTimer > 30) { e.frame ^= 1; e.frameTimer = 0; }
    if (e.x + e.w / 2 >= W - 6 || e.x - e.w / 2 <= 6) hitWall = true;
  }
  if (hitWall) {
    enemyDir *= -1;
    for (const e of aliveEnemies) e.y += 10;
  }

  // Enemy shooting
  enemyShootTimer--;
  const shootRate = Math.max(40, 90 - wave * 7);
  if (enemyShootTimer <= 0 && aliveEnemies.length > 0) {
    const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
    enemyBullets.push({ x: shooter.x, y: shooter.y + shooter.h / 2, vy: 4 + wave * 0.4 });
    enemyShootTimer = shootRate + Math.random() * 30;
  }

  // Bullet-enemy collision
  for (const b of bullets) {
    for (const e of enemies) {
      if (!e.alive) continue;
      if (Math.abs(b.x - e.x) < e.w / 2 + 2 && Math.abs(b.y - e.y) < e.h / 2 + 6) {
        e.alive = false;
        b.y = -999;
        const pts = [10, 20, 40][e.type];
        score += pts * wave;
        spawnParticles(e.x, e.y, ['#ff006e', '#ffee00', '#00ffff'][e.type], 14);
        spawnExplosion(e.x, e.y, ['#ff006e', '#ffee00', '#00ffff'][e.type]);
        updateHUD();
      }
    }
  }

  // Enemy bullet-player collision
  for (const b of enemyBullets) {
    if (Math.abs(b.x - player.x) < player.w / 2 - 2 && Math.abs(b.y - player.y) < player.h / 2 + 4) {
      b.y = H + 999;
      lives--;
      spawnParticles(player.x, player.y, '#00ffff', 20);
      spawnExplosion(player.x, player.y, '#00ffff');
      updateHUD();
      if (lives <= 0) { endGame(); return; }
    }
  }

  // Enemy reaches bottom
  for (const e of aliveEnemies) {
    if (e.y + e.h / 2 >= H - 55) {
      endGame(); return;
    }
  }

  updateParticles();
}

function updateParticles() {
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.08;
    p.life -= 0.025;
    return p.life > 0;
  });
  explosions = explosions.filter(e => {
    e.r += 2.5; e.alpha -= 0.06;
    return e.alpha > 0;
  });
}

// --- Draw ---
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Scanline overlay
  ctx.fillStyle = 'rgba(0,0,0,0.03)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);

  // Bottom barrier
  ctx.save();
  ctx.strokeStyle = 'rgba(0,255,255,0.15)';
  ctx.setLineDash([6, 4]);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, H - 55);
  ctx.lineTo(W, H - 55);
  ctx.stroke();
  ctx.restore();

  // Wave transition message
  if (waveTransition) {
    ctx.save();
    const t = 1 - waveTimer / WAVE_PAUSE;
    ctx.globalAlpha = Math.min(1, t * 3);
    ctx.fillStyle = '#00ffff';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 30;
    ctx.font = '900 2rem Orbitron, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`WAVE ${wave + 1} INCOMING`, W / 2, H / 2);
    ctx.restore();
  }

  // Explosions
  for (const e of explosions) {
    ctx.save();
    ctx.globalAlpha = e.alpha * 0.4;
    ctx.strokeStyle = e.color;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 20;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Particles
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    ctx.restore();
  }

  // Enemies
  for (const e of enemies) drawEnemy(e);

  // Bullets
  for (const b of bullets) drawBullet(b, '#00ffff');
  for (const b of enemyBullets) drawBullet(b, '#ff006e');

  // Player
  if (lives > 0) drawPlayer(player);
}

function gameLoop() {
  update();
  draw();
  animId = requestAnimationFrame(gameLoop);
}

function startGame() {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('game-over-screen').style.display = 'none';
  gameRunning = true;
  initGame();
  if (animId) cancelAnimationFrame(animId);
  gameLoop();
}

function endGame() {
  gameRunning = false;
  cancelAnimationFrame(animId);
  document.getElementById('final-score').textContent = `SCORE: ${String(score).padStart(6, '0')}`;
  document.getElementById('wave-reached').textContent = `WAVE ${String(wave).padStart(2, '0')} REACHED`;
  document.getElementById('game-over-screen').style.display = 'flex';
}

// --- Input ---
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

setupMobile();
</script>
</body>
</html>
