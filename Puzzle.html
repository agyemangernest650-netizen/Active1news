<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BOING! — Platformer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap');

:root {
  --sky1: #74ebd5;
  --sky2: #ACB6E5;
  --sun: #FFD93D;
  --coral: #FF6B6B;
  --mint: #6BCB77;
  --blue: #4D96FF;
  --purple: #C77DFF;
  --orange: #FF9A3C;
  --pink: #FF6EC7;
  --white: #FFFFFF;
  --shadow: rgba(0,0,0,0.15);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: linear-gradient(160deg, var(--sky1) 0%, var(--sky2) 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Nunito', sans-serif;
  overflow: hidden;
}

/* Floating clouds bg */
.clouds {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.cloud {
  position: absolute;
  background: white;
  border-radius: 50px;
  opacity: 0.6;
  animation: drift linear infinite;
}
.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  background: white;
  border-radius: 50%;
}

@keyframes drift {
  from { transform: translateX(-200px); }
  to   { transform: translateX(110vw); }
}

/* HUD */
#hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: 600px;
  padding: 0.5rem 0.75rem;
}

.hud-pill {
  background: white;
  border-radius: 50px;
  padding: 0.3rem 1rem;
  font-family: 'Fredoka One', cursive;
  font-size: 1.1rem;
  color: #333;
  box-shadow: 0 4px 12px var(--shadow), 0 2px 0 rgba(0,0,0,0.08);
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.hud-pill .icon { font-size: 1.2rem; }
.hud-score { color: var(--coral); }
.hud-lives { color: var(--mint); }
.hud-level { color: var(--blue); }

/* Canvas wrapper */
#canvas-wrap {
  position: relative;
  border-radius: 24px;
  overflow: hidden;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.2),
    0 4px 0 rgba(0,0,0,0.1),
    0 0 0 4px white;
}

canvas {
  display: block;
  background: transparent;
}

/* Mobile controls */
#mobile-pad {
  display: none;
  gap: 10px;
  margin-top: 12px;
  align-items: center;
}

@media (pointer: coarse), (max-width: 640px) {
  #mobile-pad { display: flex; }
}

.pad-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: white;
  border: none;
  font-size: 1.4rem;
  cursor: pointer;
  box-shadow: 0 5px 0 rgba(0,0,0,0.12), 0 2px 12px rgba(0,0,0,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.08s, box-shadow 0.08s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
}
.pad-btn:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 rgba(0,0,0,0.12);
}
#pad-jump { width: 72px; height: 72px; font-size: 1.6rem; background: var(--coral); color: white; }

/* Overlay screens */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 24px;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(4px);
  z-index: 10;
}

.screen h1 {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(2.5rem, 8vw, 4rem);
  background: linear-gradient(135deg, var(--coral), var(--orange), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.3rem;
  filter: drop-shadow(0 2px 0 rgba(0,0,0,0.08));
}

.screen .tagline {
  font-size: 0.9rem;
  color: #888;
  font-weight: 700;
  letter-spacing: 0.05em;
  margin-bottom: 2rem;
}

.big-btn {
  font-family: 'Fredoka One', cursive;
  font-size: 1.3rem;
  letter-spacing: 0.05em;
  padding: 0.8rem 2.5rem;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, var(--coral) 0%, var(--orange) 100%);
  color: white;
  cursor: pointer;
  box-shadow: 0 6px 0 #c7431a, 0 8px 20px rgba(255,107,107,0.4);
  transition: transform 0.1s, box-shadow 0.1s;
}
.big-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #c7431a, 0 12px 24px rgba(255,107,107,0.4); }
.big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c7431a; }

.screen .sub-info {
  margin-top: 1.2rem;
  font-size: 0.75rem;
  color: #bbb;
  text-align: center;
  line-height: 2;
}

.final-score-big {
  font-family: 'Fredoka One', cursive;
  font-size: 3rem;
  color: var(--coral);
  margin: 0.5rem 0 1.5rem;
}

.stars { font-size: 2rem; margin-bottom: 0.5rem; }
</style>
</head>
<body>

<div class="clouds" id="clouds"></div>

<div id="hud">
  <div class="hud-pill hud-score"><span class="icon">⭐</span><span id="score-val">0</span></div>
  <div class="hud-pill hud-level"><span class="icon">🌈</span>LVL <span id="level-val">1</span></div>
  <div class="hud-pill hud-lives"><span id="lives-val">❤️❤️❤️</span></div>
</div>

<div id="canvas-wrap">
  <canvas id="c" width="600" height="380"></canvas>

  <div class="screen" id="title-screen">
    <h1>BOING!</h1>
    <div class="tagline">🍭 A BOUNCY PLATFORMER ADVENTURE 🍭</div>
    <button class="big-btn" id="start-btn">PLAY!</button>
    <div class="sub-info">
      ← → Move &nbsp;|&nbsp; SPACE / ↑ Jump (double jump!)<br>
      Collect ⭐ stars &nbsp;|&nbsp; Avoid 🌀 spinners
    </div>
  </div>

  <div class="screen" id="over-screen" style="display:none">
    <div class="stars" id="over-stars">💀</div>
    <h1>GAME OVER</h1>
    <div class="final-score-big" id="final-score">0</div>
    <button class="big-btn" id="restart-btn">TRY AGAIN!</button>
  </div>

  <div class="screen" id="win-screen" style="display:none">
    <div class="stars">🎉🌟🎉</div>
    <h1>YOU WIN!</h1>
    <div class="final-score-big" id="win-score">0</div>
    <button class="big-btn" id="win-btn">PLAY AGAIN!</button>
  </div>
</div>

<div id="mobile-pad">
  <button class="pad-btn" id="pad-left">◀</button>
  <button class="pad-btn" id="pad-jump" id="pad-jump">↑</button>
  <button class="pad-btn" id="pad-right">▶</button>
</div>

<script>
// ── CLOUDS ────────────────────────────────────────────────────────────────────
(function spawnClouds() {
  const wrap = document.getElementById('clouds');
  for (let i = 0; i < 6; i++) {
    const d = document.createElement('div');
    d.className = 'cloud';
    const w = 80 + Math.random() * 120, h = 30 + Math.random() * 30;
    d.style.cssText = `width:${w}px;height:${h}px;top:${5+Math.random()*40}%;left:${Math.random()*100}%;animation-duration:${20+Math.random()*30}s;animation-delay:${-Math.random()*40}s`;
    d.style.before = '';
    wrap.appendChild(d);
  }
})();

// ── CANVAS SETUP ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── PALETTE ───────────────────────────────────────────────────────────────────
const COLORS = {
  sky:    ['#c9f0ff','#e0f7fa'],
  ground: '#5C3D2E',
  grass:  '#6BCB77',
  plat:   ['#FF6B6B','#FF9A3C','#FFD93D','#4D96FF','#C77DFF','#6BCB77'],
  star:   '#FFD93D',
  coin:   '#FFD93D',
  spike:  '#FF6EC7',
  spinner:'#C77DFF',
  player: '#FF6B6B',
};

// ── LEVELS ────────────────────────────────────────────────────────────────────
// Each platform: {x, y, w, color?, moving?, range?, speed?}
// Each star:     {x, y}
// Each spinner:  {x, y, radius}
function makeLevels() {
  return [
    { // Level 1 - gentle intro
      platforms: [
        {x:0,   y:340, w:600, color:'#6BCB77'}, // ground
        {x:80,  y:270, w:100, color:'#FF6B6B'},
        {x:240, y:220, w:110, color:'#FF9A3C'},
        {x:390, y:270, w:100, color:'#FFD93D'},
        {x:500, y:190, w:100, color:'#4D96FF'},
      ],
      stars: [{x:130,y:240},{x:290,y:190},{x:440,y:240},{x:545,y:160}],
      spinners: [{x:300,y:310,r:14}],
      startX: 40, goal: {x:560, y:160}
    },
    { // Level 2 - moving platform
      platforms: [
        {x:0,   y:340, w:200, color:'#6BCB77'},
        {x:280, y:340, w:200, color:'#6BCB77'},
        {x:100, y:260, w:90,  color:'#FF6B6B'},
        {x:220, y:200, w:90,  color:'#C77DFF', moving:true, range:80, speed:1.2},
        {x:370, y:250, w:90,  color:'#FF9A3C'},
        {x:490, y:180, w:90,  color:'#4D96FF'},
      ],
      stars: [{x:145,y:230},{x:265,y:168},{x:415,y:220},{x:535,y:150}],
      spinners: [{x:160,y:315,r:14},{x:430,y:315,r:14}],
      startX: 30, goal:{x:530,y:150}
    },
    { // Level 3 - tricky
      platforms: [
        {x:0,   y:340, w:120, color:'#6BCB77'},
        {x:160, y:300, w:80,  color:'#FF6B6B'},
        {x:280, y:260, w:80,  color:'#FF9A3C', moving:true, range:60, speed:1.8},
        {x:400, y:220, w:80,  color:'#FFD93D'},
        {x:500, y:170, w:80,  color:'#C77DFF'},
        {x:60,  y:200, w:70,  color:'#4D96FF', moving:true, range:50, speed:1.5},
      ],
      stars: [{x:85,y:170},{x:200,y:270},{x:320,y:228},{x:440,y:190},{x:540,y:140}],
      spinners: [{x:230,y:315,r:14},{x:360,y:315,r:16},{x:480,y:315,r:14}],
      startX: 30, goal:{x:535,y:140}
    }
  ];
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let state, player, platforms, stars, spinners, particles, goalObj;
let keys = {}, mobKeys = {};
let animId, level, score, lives;
let gameActive = false;

const GRAVITY = 0.55, JUMP_FORCE = -13.5, MOVE_SPD = 4.5, MAX_FALL = 18;

function initLevel(lvl) {
  const def = makeLevels()[lvl];
  platforms = def.platforms.map(p => ({...p, origX: p.x, t: Math.random()*100}));
  stars = def.stars.map(s => ({...s, collected: false, bob: Math.random()*Math.PI*2}));
  spinners = def.spinners.map(s => ({...s, angle: Math.random()*Math.PI*2}));
  goalObj = {...def.goal, pulse: 0};

  player = {
    x: def.startX, y: 280,
    vx: 0, vy: 0,
    w: 28, h: 32,
    onGround: false,
    jumpsLeft: 2,
    squish: 1, squishV: 0,
    invincible: 0,
    facing: 1,
    runFrame: 0, runTimer: 0,
  };
  particles = [];
  state = 'playing';
}

function startGame() {
  level = 0; score = 0; lives = 3;
  updateHUD();
  hideScreens();
  gameActive = true;
  initLevel(level);
  if (animId) cancelAnimationFrame(animId);
  loop();
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'ArrowUp') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// Mobile
function addPad(id, key) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchstart', e => { e.preventDefault(); mobKeys[key] = true; }, {passive:false});
  el.addEventListener('touchend',   e => { e.preventDefault(); mobKeys[key] = false; }, {passive:false});
  el.addEventListener('mousedown',  () => mobKeys[key] = true);
  el.addEventListener('mouseup',    () => mobKeys[key] = false);
  el.addEventListener('mouseleave', () => mobKeys[key] = false);
}
addPad('pad-left','left'); addPad('pad-right','right'); addPad('pad-jump','jump');

function isLeft()  { return keys['ArrowLeft']  || keys['a'] || keys['A'] || mobKeys['left']; }
function isRight() { return keys['ArrowRight'] || keys['d'] || keys['D'] || mobKeys['right']; }
function isJump()  { return keys[' '] || keys['ArrowUp'] || keys['w'] || keys['W'] || mobKeys['jump']; }

let jumpPressed = false;

// ── PHYSICS ───────────────────────────────────────────────────────────────────
function update() {
  if (state !== 'playing') return;

  // Moving platforms
  for (const p of platforms) {
    if (p.moving) {
      p.t += p.speed * 0.02;
      p.x = p.origX + Math.sin(p.t) * p.range;
    }
  }

  // Player horizontal
  if (isLeft())  { player.vx -= 1.2; player.facing = -1; }
  if (isRight()) { player.vx += 1.2; player.facing =  1; }
  player.vx *= 0.78;
  if (Math.abs(player.vx) > MOVE_SPD) player.vx = Math.sign(player.vx) * MOVE_SPD;

  // Jump
  const wantsJump = isJump();
  if (wantsJump && !jumpPressed && player.jumpsLeft > 0) {
    player.vy = player.jumpsLeft === 2 ? JUMP_FORCE : JUMP_FORCE * 0.85;
    player.jumpsLeft--;
    player.squish = 0.6;
    player.squishV = 0.08;
    spawnParticles(player.x + player.w/2, player.y + player.h, '#fff', 6, true);
    jumpPressed = true;
  }
  if (!wantsJump) jumpPressed = false;

  // Gravity
  player.vy += GRAVITY;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;

  player.x += player.vx;
  player.y += player.vy;

  // Wall bounds
  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x + player.w > W) { player.x = W - player.w; player.vx = 0; }

  // Platform collision
  player.onGround = false;
  for (const p of platforms) {
    const ph = 14; // platform visual height
    if (player.x + player.w > p.x && player.x < p.x + p.w &&
        player.y + player.h > p.y && player.y + player.h < p.y + ph + player.vy + 2 &&
        player.vy >= 0) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.jumpsLeft = 2;
      // Carry on moving platform
      if (p.moving) player.x += Math.cos(p.t) * p.speed * p.range * 0.02;
    }
  }

  // Fall off bottom → die
  if (player.y > H + 40) loseLife();

  // Squish spring
  player.squish += player.squishV;
  player.squishV += (1 - player.squish) * 0.25;
  player.squishV *= 0.7;

  // Run animation
  if (player.onGround && Math.abs(player.vx) > 0.5) {
    player.runTimer++;
    if (player.runTimer > 8) { player.runFrame ^= 1; player.runTimer = 0; }
  } else { player.runFrame = 0; }

  // Invincibility frames
  if (player.invincible > 0) player.invincible--;

  // Stars
  for (const s of stars) {
    if (s.collected) continue;
    s.bob += 0.05;
    if (rectsOverlap(player, {x:s.x-10, y:s.y-10, w:20, h:20})) {
      s.collected = true;
      score += 100;
      updateHUD();
      spawnParticles(s.x, s.y, '#FFD93D', 10);
      spawnScorePopup(s.x, s.y - 10, '+100');
    }
  }

  // Spinners
  for (const sp of spinners) {
    sp.angle += 0.04;
    if (player.invincible === 0) {
      const dx = (player.x + player.w/2) - sp.x;
      const dy = (player.y + player.h/2) - sp.y;
      if (Math.sqrt(dx*dx+dy*dy) < sp.r + 12) loseLife();
    }
  }

  // Goal
  goalObj.pulse += 0.07;
  if (rectsOverlap(player, {x:goalObj.x-18, y:goalObj.y-18, w:36, h:36})) {
    if (level < makeLevels().length - 1) {
      score += 500;
      level++;
      spawnParticles(player.x+player.w/2, player.y, '#FFD93D', 20);
      initLevel(level);
      updateHUD();
    } else {
      score += 1000;
      updateHUD();
      state = 'win';
      showWin();
    }
  }

  // Particles
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15;
    p.life -= 0.03; p.size *= 0.96;
    return p.life > 0;
  });

  // Score popups
  scorePopups = scorePopups.filter(p => {
    p.y -= 1.2; p.life -= 0.04;
    return p.life > 0;
  });
}

function loseLife() {
  lives--;
  updateHUD();
  spawnParticles(player.x+player.w/2, player.y+player.h/2, '#FF6B6B', 16);
  if (lives <= 0) {
    state = 'over';
    setTimeout(showOver, 600);
  } else {
    const def = makeLevels()[level];
    player.x = def.startX; player.y = 200;
    player.vx = 0; player.vy = 0;
    player.invincible = 120;
  }
}

function rectsOverlap(a, b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

// ── PARTICLES ─────────────────────────────────────────────────────────────────
function spawnParticles(x, y, color, n, dust=false) {
  for (let i=0;i<n;i++) {
    const angle = Math.random()*Math.PI*2;
    const spd = dust ? 1+Math.random()*2 : 2+Math.random()*4;
    particles.push({
      x, y,
      vx: Math.cos(angle)*spd,
      vy: Math.sin(angle)*spd - (dust?0:1),
      color, life:1, size: 4+Math.random()*5
    });
  }
}

let scorePopups = [];
function spawnScorePopup(x, y, text) {
  scorePopups.push({x, y, text, life:1});
}

// ── DRAW ──────────────────────────────────────────────────────────────────────
function draw() {
  // Sky gradient
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#87CEEB');
  grad.addColorStop(1,'#E0F7FA');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Distant hills
  ctx.fillStyle = 'rgba(107,203,119,0.25)';
  ctx.beginPath();
  ctx.moveTo(0,H); ctx.bezierCurveTo(100,280,200,320,300,300);
  ctx.bezierCurveTo(400,280,500,310,600,290); ctx.lineTo(600,H);
  ctx.fill();
  ctx.fillStyle = 'rgba(107,203,119,0.18)';
  ctx.beginPath();
  ctx.moveTo(0,H); ctx.bezierCurveTo(80,300,220,340,350,320);
  ctx.bezierCurveTo(450,305,530,330,600,310); ctx.lineTo(600,H);
  ctx.fill();

  // Platforms
  for (const p of platforms) {
    const col = p.color || COLORS.plat[0];
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    roundRect(p.x+4, p.y+8, p.w, 14, 7);
    // Body
    ctx.fillStyle = col;
    roundRect(p.x, p.y, p.w, 14, 7);
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    roundRect(p.x+4, p.y+2, p.w-8, 4, 3);
    // Grass dots
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let dx=12;dx<p.w-8;dx+=18) {
      ctx.beginPath(); ctx.arc(p.x+dx, p.y+7, 2, 0, Math.PI*2); ctx.fill();
    }
  }

  // Stars
  for (const s of stars) {
    if (s.collected) continue;
    const by = Math.sin(s.bob) * 4;
    drawStar(s.x, s.y + by, 11, '#FFD93D', '#FFF176');
  }

  // Spinners
  for (const sp of spinners) {
    drawSpinner(sp.x, sp.y, sp.r, sp.angle);
  }

  // Goal flag / portal
  drawGoal(goalObj.x, goalObj.y, goalObj.pulse);

  // Player
  drawPlayer();

  // Particles
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size/2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // Score popups
  for (const p of scorePopups) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = '#FFD93D';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.font = 'bold 16px Fredoka One, cursive';
    ctx.textAlign = 'center';
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  }

  // Level name tag
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  roundRect(10, 10, 110, 26, 13);
  ctx.fillStyle = '#555';
  ctx.font = '700 12px Nunito, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`LEVEL ${level+1} OF ${makeLevels().length}`, 20, 27);
  ctx.restore();
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  ctx.fill();
}

function drawPlayer() {
  const p = player;
  const cx = p.x + p.w/2, cy = p.y + p.h/2;
  const sx = p.squish, sy = 2 - p.squish;

  ctx.save();
  if (p.invincible > 0 && Math.floor(p.invincible/4) % 2 === 0) {
    ctx.globalAlpha = 0.4;
  }
  ctx.translate(cx, p.y + p.h);
  ctx.scale(p.facing * sx, sy);
  ctx.translate(-p.w/2, -p.h);

  // Shadow
  ctx.save();
  ctx.globalAlpha *= 0.15;
  ctx.fillStyle = '#000';
  ctx.scale(1, 0.3);
  ctx.beginPath();
  ctx.ellipse(p.w/2, p.h+4, p.w/2+2, 6, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Body - round jellybean shape
  ctx.fillStyle = '#FF6B6B';
  ctx.shadowColor = '#FF6B6B';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.ellipse(p.w/2, p.h/2+2, p.w/2, p.h/2, 0, 0, Math.PI*2);
  ctx.fill();

  // Belly
  ctx.fillStyle = '#FFB3B3';
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.ellipse(p.w/2, p.h/2+4, p.w/3, p.h/3.5, 0, 0, Math.PI*2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(p.w/2-5, p.h/2-4, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(p.w/2+5, p.h/2-4, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(p.w/2-4, p.h/2-4, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(p.w/2+6, p.h/2-4, 2.5, 0, Math.PI*2); ctx.fill();
  // Pupils shine
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(p.w/2-3, p.h/2-5.5, 1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(p.w/2+7, p.h/2-5.5, 1, 0, Math.PI*2); ctx.fill();

  // Mouth
  ctx.strokeStyle = '#c0392b';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(p.w/2, p.h/2+2, 5, 0.2, Math.PI-0.2);
  ctx.stroke();

  // Legs (run anim)
  const legOff = player.runFrame === 0 ? 3 : -3;
  ctx.fillStyle = '#FF6B6B';
  ctx.beginPath(); ctx.ellipse(p.w/2-6, p.h-3+legOff, 4, 6, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(p.w/2+6, p.h-3-legOff, 4, 6,  0.3, 0, Math.PI*2); ctx.fill();

  // Ear/antenna bounce
  ctx.fillStyle = '#FF9A3C';
  ctx.beginPath();
  ctx.moveTo(p.w/2-3, 2);
  ctx.lineTo(p.w/2-7, -8+Math.sin(Date.now()/200)*3);
  ctx.lineTo(p.w/2+1, -4);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawStar(x, y, r, c1, c2) {
  ctx.save();
  ctx.shadowColor = c1; ctx.shadowBlur = 14;
  const spikes = 5, outer = r, inner = r*0.45;
  ctx.beginPath();
  for (let i=0;i<spikes*2;i++) {
    const rad = i%2===0 ? outer : inner;
    const angle = (i * Math.PI) / spikes - Math.PI/2;
    i===0 ? ctx.moveTo(x+Math.cos(angle)*rad, y+Math.sin(angle)*rad)
           : ctx.lineTo(x+Math.cos(angle)*rad, y+Math.sin(angle)*rad);
  }
  ctx.closePath();
  const g = ctx.createRadialGradient(x,y-3,1,x,y,r);
  g.addColorStop(0, c2); g.addColorStop(1, c1);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.restore();
}

function drawSpinner(x, y, r, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.shadowColor = '#C77DFF'; ctx.shadowBlur = 16;
  for (let i=0;i<3;i++) {
    ctx.rotate(Math.PI*2/3);
    ctx.fillStyle = ['#C77DFF','#FF6EC7','#4D96FF'][i];
    ctx.beginPath();
    ctx.arc(r, 0, r*0.55, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(0,0,r*0.4,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawGoal(x, y, pulse) {
  ctx.save();
  const p = Math.sin(pulse)*0.3+0.7;
  ctx.shadowColor = '#FFD93D'; ctx.shadowBlur = 20*p;
  // Portal ring
  ctx.strokeStyle = '#FFD93D';
  ctx.lineWidth = 4;
  ctx.globalAlpha = p;
  ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = p*0.5;
  ctx.strokeStyle = '#FF9A3C';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI*2); ctx.stroke();
  // Star inside
  ctx.globalAlpha = 1;
  drawStar(x, y, 13, '#FFD93D', '#fff');
  // Flag pole
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y+18); ctx.lineTo(x, y+45); ctx.stroke();
  ctx.fillStyle = '#FF6B6B';
  ctx.beginPath(); ctx.moveTo(x, y+18); ctx.lineTo(x+18, y+25); ctx.lineTo(x, y+32); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('score-val').textContent = score;
  document.getElementById('level-val').textContent = level+1;
  document.getElementById('lives-val').textContent = '❤️'.repeat(Math.max(0,lives)) || '💀';
}

// ── SCREENS ───────────────────────────────────────────────────────────────────
function hideScreens() {
  ['title-screen','over-screen','win-screen'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
}
function showOver() {
  document.getElementById('final-score').textContent = score;
  document.getElementById('over-screen').style.display = 'flex';
}
function showWin() {
  document.getElementById('win-score').textContent = score;
  document.getElementById('win-screen').style.display = 'flex';
}

// ── LOOP ──────────────────────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

// ── BUTTONS ───────────────────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
document.getElementById('win-btn').addEventListener('click', startGame);
</script>
