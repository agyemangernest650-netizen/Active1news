<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PUZZLE ATELIER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap');

:root {
  --cream:   #f5f0e8;
  --warm:    #e8dfc8;
  --brown:   #6b4f3a;
  --gold:    #c9973a;
  --dark:    #1e1611;
  --text:    #3a2e22;
  --shadow:  rgba(30,22,17,0.18);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--cream);
  color: var(--text);
  font-family: 'Lato', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* Wood grain background */
body::before {
  content:'';
  position:fixed;
  inset:0;
  background:
    repeating-linear-gradient(
      92deg,
      transparent 0px,
      transparent 18px,
      rgba(139,90,43,0.03) 18px,
      rgba(139,90,43,0.03) 20px
    ),
    repeating-linear-gradient(
      180deg,
      transparent 0px,
      transparent 60px,
      rgba(139,90,43,0.02) 60px,
      rgba(139,90,43,0.02) 62px
    ),
    linear-gradient(160deg, #f5f0e8 0%, #ede4d0 40%, #e8dfc8 100%);
  pointer-events:none;
  z-index:0;
}

.page { position:relative; z-index:1; width:100%; max-width:980px; padding:0 16px 40px; }

/* Header */
header {
  text-align:center;
  padding: 28px 0 20px;
  border-bottom: 1px solid rgba(107,79,58,0.15);
  margin-bottom: 22px;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--dark);
}
h1 em {
  font-style: italic;
  color: var(--gold);
}

.subtitle {
  font-size: 0.72rem;
  letter-spacing: 0.45em;
  color: var(--brown);
  opacity: 0.6;
  text-transform: uppercase;
  margin-top: 5px;
}

/* Controls bar */
.controls-bar {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 18px;
  justify-content: space-between;
}

.ctrl-group {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.label-sm {
  font-size: 0.62rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--brown);
  opacity: 0.65;
}

.pill-btn {
  font-family: 'Lato', sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 7px 16px;
  border: 1.5px solid rgba(107,79,58,0.3);
  background: transparent;
  color: var(--brown);
  cursor: pointer;
  border-radius: 100px;
  transition: all 0.18s;
}
.pill-btn:hover, .pill-btn.active {
  background: var(--brown);
  color: var(--cream);
  border-color: var(--brown);
}

.action-btn {
  font-family: 'Lato', sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 8px 22px;
  border: none;
  background: var(--gold);
  color: #fff;
  cursor: pointer;
  border-radius: 4px;
  box-shadow: 0 2px 10px rgba(201,151,58,0.35);
  transition: all 0.18s;
}
.action-btn:hover { background: #b8832a; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(201,151,58,0.45); }
.action-btn:active { transform: translateY(0); }

/* Stats */
.stats {
  display: flex;
  gap: 24px;
  align-items: center;
}
.stat { display:flex; flex-direction:column; align-items:center; gap:2px; }
.stat-val {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--dark);
  line-height: 1;
}
.stat-lbl {
  font-size: 0.55rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--brown);
  opacity: 0.55;
}

/* Progress bar */
.progress-wrap {
  height: 4px;
  background: rgba(107,79,58,0.12);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 14px;
}
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), #e8b84b);
  border-radius: 2px;
  transition: width 0.4s ease;
  box-shadow: 0 0 6px rgba(201,151,58,0.4);
}

/* Main layout */
.game-layout {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

/* Preview panel */
.preview-panel {
  width: 160px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.panel-card {
  background: rgba(255,255,255,0.55);
  border: 1px solid rgba(107,79,58,0.13);
  border-radius: 8px;
  padding: 12px;
  box-shadow: 0 2px 12px var(--shadow);
}

.panel-title {
  font-size: 0.58rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--brown);
  opacity: 0.6;
  margin-bottom: 8px;
}

#previewCanvas {
  width: 100%;
  border-radius: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  display: block;
}

/* Board + tray */
.board-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

/* Puzzle board */
.board-frame {
  background: rgba(255,255,255,0.45);
  border: 1px solid rgba(107,79,58,0.15);
  border-radius: 10px;
  padding: 14px;
  box-shadow: 0 4px 24px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.8);
  position: relative;
}

#puzzleBoard {
  display: grid;
  gap: 3px;
  margin: 0 auto;
  position: relative;
}

.puzzle-cell {
  background: rgba(107,79,58,0.08);
  border-radius: 3px;
  border: 1.5px dashed rgba(107,79,58,0.18);
  position: relative;
  transition: background 0.2s, border-color 0.2s;
}
.puzzle-cell.hover-target {
  background: rgba(201,151,58,0.12);
  border-color: var(--gold);
}
.puzzle-cell.filled {
  background: transparent;
  border: 1.5px solid rgba(107,79,58,0.1);
}
.puzzle-cell.correct {
  border-color: rgba(72,160,80,0.35);
  background: rgba(72,160,80,0.04);
}

/* Pieces tray */
.tray-frame {
  background: rgba(255,255,255,0.45);
  border: 1px solid rgba(107,79,58,0.15);
  border-radius: 10px;
  padding: 12px;
  box-shadow: 0 4px 24px var(--shadow);
}

.tray-title {
  font-size: 0.58rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--brown);
  opacity: 0.55;
  margin-bottom: 10px;
}

#pieceTray {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 80px;
  align-content: flex-start;
}

/* Piece canvas */
.piece-wrap {
  position: relative;
  cursor: grab;
  transition: transform 0.15s, box-shadow 0.15s;
  border-radius: 4px;
  flex-shrink: 0;
}
.piece-wrap:hover { transform: translateY(-3px) scale(1.04); }
.piece-wrap.dragging {
  opacity: 0.3;
  cursor: grabbing;
}
.piece-wrap canvas {
  display: block;
  border-radius: 3px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
}

/* Floating drag piece */
#dragGhost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  display: none;
  border-radius: 4px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  transform: translate(-50%, -50%) rotate(1.5deg) scale(1.08);
}

/* Win overlay */
.win-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(30,22,17,0.7);
  z-index: 500;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.win-overlay.show { display: flex; }

.win-card {
  background: var(--cream);
  border-radius: 16px;
  padding: 48px 52px;
  text-align: center;
  box-shadow: 0 20px 80px rgba(0,0,0,0.4);
  max-width: 380px;
  animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes popIn {
  from { transform: scale(0.7); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}

.win-emoji { font-size: 3.5rem; margin-bottom: 12px; }
.win-title {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 6px;
}
.win-title em { font-style: italic; color: var(--gold); }
.win-sub {
  font-size: 0.8rem;
  letter-spacing: 0.15em;
  color: var(--brown);
  opacity: 0.7;
  margin-bottom: 28px;
  text-transform: uppercase;
}
.win-stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-bottom: 28px;
}
.win-stat { display: flex; flex-direction: column; gap: 3px; }
.win-stat-val {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--gold);
}
.win-stat-lbl {
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--brown);
  opacity: 0.6;
}

/* Confetti */
.confetti-piece {
  position: fixed;
  width: 8px;
  height: 8px;
  pointer-events: none;
  z-index: 600;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

@media (max-width: 640px) {
  .preview-panel { display: none; }
  .game-layout { flex-direction: column; }
}
</style>
</head>
<body>
<div id="dragGhost"><canvas id="ghostCanvas"></canvas></div>
<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <div class="win-emoji">🎉</div>
    <div class="win-title">Puzzle <em>Complete!</em></div>
    <div class="win-sub">Well done — a masterpiece assembled</div>
    <div class="win-stats">
      <div class="win-stat">
        <div class="win-stat-val" id="winMoves">0</div>
        <div class="win-stat-lbl">Moves</div>
      </div>
      <div class="win-stat">
        <div class="win-stat-val" id="winTime">0:00</div>
        <div class="win-stat-lbl">Time</div>
      </div>
    </div>
    <button class="action-btn" onclick="closeWin()">Play Again</button>
  </div>
</div>

<div class="page">
  <header>
    <h1>Puzzle <em>Atelier</em></h1>
    <div class="subtitle">Drag · Drop · Discover</div>
  </header>

  <div class="controls-bar">
    <div class="ctrl-group">
      <span class="label-sm">Scene</span>
      <button class="pill-btn active" onclick="selectScene(0,this)">Sunset</button>
      <button class="pill-btn" onclick="selectScene(1,this)">Forest</button>
      <button class="pill-btn" onclick="selectScene(2,this)">Ocean</button>
      <button class="pill-btn" onclick="selectScene(3,this)">Mountain</button>
    </div>
    <div class="ctrl-group">
      <span class="label-sm">Pieces</span>
      <button class="pill-btn active" id="d9"  onclick="selectDiff(9,this)">9</button>
      <button class="pill-btn" id="d16" onclick="selectDiff(16,this)">16</button>
      <button class="pill-btn" id="d25" onclick="selectDiff(25,this)">25</button>
    </div>
    <button class="action-btn" onclick="newGame()">New Game</button>
  </div>

  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>

  <div class="controls-bar" style="margin-bottom:12px">
    <div class="stats">
      <div class="stat"><div class="stat-val" id="movesVal">0</div><div class="stat-lbl">Moves</div></div>
      <div class="stat"><div class="stat-val" id="timeVal">0:00</div><div class="stat-lbl">Time</div></div>
      <div class="stat"><div class="stat-val" id="leftVal">—</div><div class="stat-lbl">Remaining</div></div>
    </div>
    <button class="pill-btn" onclick="toggleHint()">💡 Hint</button>
  </div>

  <div class="game-layout">
    <div class="preview-panel">
      <div class="panel-card">
        <div class="panel-title">Reference</div>
        <canvas id="previewCanvas" width="136" height="136"></canvas>
      </div>
    </div>

    <div class="board-col">
      <div class="board-frame">
        <div id="puzzleBoard"></div>
      </div>
      <div class="tray-frame">
        <div class="tray-title">Pieces — drag to the board above</div>
        <div id="pieceTray"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Scene Painters ────────────────────────────────────────
const SCENES = [
  {
    name: 'Sunset',
    paint(ctx, W, H) {
      // Sky gradient
      const sky = ctx.createLinearGradient(0,0,0,H*0.65);
      sky.addColorStop(0,'#1a0533');
      sky.addColorStop(0.3,'#6b1f5e');
      sky.addColorStop(0.6,'#e8612a');
      sky.addColorStop(1,'#f5c842');
      ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*0.65);

      // Sun
      const sg = ctx.createRadialGradient(W/2,H*0.5,0,W/2,H*0.5,W*0.15);
      sg.addColorStop(0,'#fff8d0'); sg.addColorStop(0.4,'#ffe066'); sg.addColorStop(1,'rgba(255,140,0,0)');
      ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);

      // Clouds
      function cloud(cx2,cy,r){
        ctx.fillStyle='rgba(255,200,150,0.25)';
        for(let i=-2;i<=2;i++) { ctx.beginPath(); ctx.arc(cx2+i*r*0.7,cy,r*(1-Math.abs(i)*0.25),0,Math.PI*2); ctx.fill(); }
      }
      cloud(W*0.2,H*0.15,W*0.07); cloud(W*0.7,H*0.1,W*0.06); cloud(W*0.55,H*0.22,W*0.05);

      // Water
      const water = ctx.createLinearGradient(0,H*0.65,0,H);
      water.addColorStop(0,'#1a3a5c'); water.addColorStop(1,'#0d1e30');
      ctx.fillStyle=water; ctx.fillRect(0,H*0.65,W,H*0.35);

      // Sun reflection
      const ref = ctx.createLinearGradient(0,H*0.65,0,H);
      ref.addColorStop(0,'rgba(255,200,50,0.4)'); ref.addColorStop(1,'rgba(255,150,0,0)');
      ctx.fillStyle=ref;
      ctx.fillRect(W*0.38,H*0.65,W*0.24,H*0.35);

      // Ripples
      ctx.strokeStyle='rgba(255,200,80,0.15)'; ctx.lineWidth=1;
      for(let y=H*0.68;y<H;y+=H*0.04){
        ctx.beginPath(); ctx.moveTo(W*0.3,y); ctx.quadraticCurveTo(W/2,y-4,W*0.7,y); ctx.stroke();
      }

      // Silhouette hills
      ctx.fillStyle='#0d0a1a';
      ctx.beginPath(); ctx.moveTo(0,H*0.65);
      ctx.quadraticCurveTo(W*0.15,H*0.52,W*0.3,H*0.63);
      ctx.quadraticCurveTo(W*0.45,H*0.48,W*0.6,H*0.6);
      ctx.quadraticCurveTo(W*0.78,H*0.54,W,H*0.62);
      ctx.lineTo(W,H*0.65); ctx.closePath(); ctx.fill();

      // Silhouette trees
      ctx.fillStyle='#080614';
      function tree(tx,ty,th){ ctx.fillRect(tx-2,ty,4,th); ctx.beginPath(); ctx.moveTo(tx,ty-th*0.8); ctx.lineTo(tx-th*0.3,ty+6); ctx.lineTo(tx+th*0.3,ty+6); ctx.closePath(); ctx.fill(); }
      [[W*0.05,H*0.56,H*0.1],[W*0.12,H*0.53,H*0.13],[W*0.82,H*0.55,H*0.11],[W*0.9,H*0.52,H*0.14],[W*0.95,H*0.57,H*0.09]].forEach(([x,y,h])=>tree(x,y,h));
    }
  },
  {
    name: 'Forest',
    paint(ctx, W, H) {
      // Sky through trees
      const sky = ctx.createLinearGradient(0,0,0,H*0.4);
      sky.addColorStop(0,'#b8d4e8'); sky.addColorStop(1,'#e8f4d0');
      ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

      // Forest floor
      const floor = ctx.createLinearGradient(0,H*0.6,0,H);
      floor.addColorStop(0,'#2d4a1e'); floor.addColorStop(1,'#1a2e0f');
      ctx.fillStyle=floor; ctx.fillRect(0,H*0.6,W,H*0.4);

      // Ground details - moss/ferns
      ctx.fillStyle='#3a5f28';
      for(let i=0;i<8;i++){
        const fx=Math.random()*W, fy=H*0.62+Math.random()*H*0.15;
        ctx.beginPath(); ctx.ellipse(fx,fy,20+Math.random()*30,8+Math.random()*12,Math.random()*0.5,0,Math.PI*2); ctx.fill();
      }

      // Light rays
      ctx.save();
      for(let i=0;i<5;i++){
        const lx=W*(0.1+i*0.2);
        const grad=ctx.createLinearGradient(lx,0,lx+20,H*0.7);
        grad.addColorStop(0,'rgba(255,255,200,0.12)'); grad.addColorStop(1,'rgba(255,255,200,0)');
        ctx.fillStyle=grad;
        ctx.beginPath(); ctx.moveTo(lx-10,0); ctx.lineTo(lx+30,0); ctx.lineTo(lx+60,H*0.7); ctx.lineTo(lx+20,H*0.7); ctx.closePath(); ctx.fill();
      }
      ctx.restore();

      // Trees - back layer
      function drawTree(tx,th,tw,col){
        ctx.fillStyle=col||'#1a3a0a';
        ctx.beginPath();
        ctx.moveTo(tx,H*0.65-th);
        ctx.lineTo(tx-tw,H*0.65);
        ctx.lineTo(tx+tw,H*0.65);
        ctx.closePath(); ctx.fill();
        // second tier
        ctx.beginPath();
        ctx.moveTo(tx,H*0.65-th*0.75);
        ctx.lineTo(tx-tw*1.3,H*0.65-th*0.3);
        ctx.lineTo(tx+tw*1.3,H*0.65-th*0.3);
        ctx.closePath(); ctx.fill();
        // trunk
        ctx.fillStyle='#3d2010';
        ctx.fillRect(tx-6,H*0.65-th*0.15,12,th*0.2);
      }
      [[W*0.05,H*0.55,W*0.09,'#0f2606'],[W*0.18,H*0.5,W*0.08,'#142e08'],[W*0.35,H*0.52,W*0.07,'#1a3a0a'],
       [W*0.55,H*0.48,W*0.09,'#0f2606'],[W*0.72,H*0.53,W*0.08,'#142e08'],[W*0.88,H*0.5,W*0.07,'#1a3a0a'],
       [W,H*0.54,W*0.06,'#0f2606']].forEach(a=>drawTree(...a));

      // Foreground dark trees
      [[W*0.0,H*0.75,W*0.11,'#080e04'],[W*0.25,H*0.7,W*0.09,'#0a1206'],[W*0.5,H*0.72,W*0.1,'#080e04'],[W*0.75,H*0.68,W*0.09,'#0a1206'],[W,H*0.74,W*0.08,'#080e04']].forEach(a=>drawTree(...a));

      // Mushrooms
      ctx.fillStyle='#c0392b';
      [[W*0.3,H*0.72],[W*0.6,H*0.75],[W*0.15,H*0.78]].forEach(([mx,my])=>{
        ctx.beginPath(); ctx.arc(mx,my,10,Math.PI,0); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.7)';
        [[mx-4,my-6],[mx,my-8],[mx+4,my-5]].forEach(([dx,dy])=>{ ctx.beginPath(); ctx.arc(dx,dy,2,0,Math.PI*2); ctx.fill(); });
        ctx.fillStyle='#d4956a'; ctx.fillRect(mx-2,my,4,8);
        ctx.fillStyle='#c0392b';
      });

      // Fireflies
      ctx.fillStyle='rgba(255,255,150,0.8)';
      for(let i=0;i<12;i++){
        const fx=W*(0.1+Math.random()*0.8), fy=H*(0.4+Math.random()*0.35);
        ctx.beginPath(); ctx.arc(fx,fy,1.5,0,Math.PI*2); ctx.fill();
        const g=ctx.createRadialGradient(fx,fy,0,fx,fy,8);
        g.addColorStop(0,'rgba(255,255,150,0.3)'); g.addColorStop(1,'rgba(255,255,150,0)');
        ctx.fillStyle=g; ctx.fillRect(fx-8,fy-8,16,16); ctx.fillStyle='rgba(255,255,150,0.8)';
      }
    }
  },
  {
    name: 'Ocean',
    paint(ctx, W, H) {
      // Sky
      const sky=ctx.createLinearGradient(0,0,0,H*0.5);
      sky.addColorStop(0,'#0a2a5e'); sky.addColorStop(0.5,'#1a6fa8'); sky.addColorStop(1,'#5db8d4');
      ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*0.5);

      // Clouds
      ctx.fillStyle='rgba(255,255,255,0.75)';
      function cloud(cx2,cy,r){
        for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(cx2+i*r*0.7,cy,r*(0.8-Math.abs(i)*0.15),0,Math.PI*2);ctx.fill();}
      }
      cloud(W*0.2,H*0.1,W*0.07); cloud(W*0.65,H*0.08,W*0.09); cloud(W*0.45,H*0.16,W*0.06);

      // Ocean
      const ocean=ctx.createLinearGradient(0,H*0.5,0,H);
      ocean.addColorStop(0,'#1a9dc4'); ocean.addColorStop(0.3,'#0e7a9e'); ocean.addColorStop(1,'#063a52');
      ctx.fillStyle=ocean; ctx.fillRect(0,H*0.5,W,H*0.5);

      // Waves
      for(let wi=0;wi<8;wi++){
        const wy=H*(0.5+wi*0.06);
        const alpha=0.15+wi*0.05;
        ctx.fillStyle=`rgba(255,255,255,${alpha})`;
        ctx.beginPath(); ctx.moveTo(0,wy);
        for(let x=0;x<=W;x+=W/6){
          ctx.quadraticCurveTo(x+W/12,wy-(wi%2===0?6:4),x+W/6,wy);
        }
        ctx.lineTo(W,wy+4); ctx.lineTo(0,wy+4); ctx.closePath(); ctx.fill();
      }

      // Sun reflection stripe
      const ref=ctx.createLinearGradient(0,H*0.5,0,H);
      ref.addColorStop(0,'rgba(255,255,255,0.25)'); ref.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=ref; ctx.fillRect(W*0.4,H*0.5,W*0.2,H*0.5);

      // Island silhouette
      ctx.fillStyle='#1a3a1a';
      ctx.beginPath(); ctx.moveTo(W*0.15,H*0.5);
      ctx.quadraticCurveTo(W*0.25,H*0.32,W*0.38,H*0.5); ctx.closePath(); ctx.fill();

      // Palm tree
      ctx.fillStyle='#4a2f12'; ctx.fillRect(W*0.27-3,H*0.32,6,H*0.14);
      ctx.fillStyle='#2d6b1a';
      [[-0.12,-0.06],[-0.06,-0.12],[0,-0.13],[0.07,-0.1],[0.11,-0.05]].forEach(([dx,dy])=>{
        ctx.beginPath(); ctx.moveTo(W*0.27,H*0.32);
        ctx.quadraticCurveTo(W*(0.27+dx/2),H*(0.32+dy),W*(0.27+dx),H*(0.32+dy+0.06));
        ctx.lineWidth=5; ctx.strokeStyle='#2d6b1a'; ctx.stroke();
      });

      // Underwater hint
      const uw=ctx.createLinearGradient(0,H*0.75,0,H);
      uw.addColorStop(0,'rgba(0,100,140,0)'); uw.addColorStop(1,'rgba(0,40,70,0.4)');
      ctx.fillStyle=uw; ctx.fillRect(0,H*0.75,W,H*0.25);

      // Seagulls
      ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1.5;
      [[W*0.55,H*0.15],[W*0.65,H*0.12],[W*0.72,H*0.18]].forEach(([bx,by])=>{
        ctx.beginPath(); ctx.moveTo(bx-8,by); ctx.quadraticCurveTo(bx,by-5,bx+8,by); ctx.stroke();
      });
    }
  },
  {
    name: 'Mountain',
    paint(ctx, W, H) {
      // Sky - cool dawn
      const sky=ctx.createLinearGradient(0,0,0,H*0.55);
      sky.addColorStop(0,'#0d1b2e'); sky.addColorStop(0.4,'#1a3a5c'); sky.addColorStop(0.7,'#4a7fa8'); sky.addColorStop(1,'#b8cfe0');
      ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*0.55);

      // Stars
      ctx.fillStyle='rgba(255,255,255,0.8)';
      for(let i=0;i<40;i++){
        const sx=Math.random()*W, sy=Math.random()*H*0.3;
        ctx.beginPath(); ctx.arc(sx,sy,0.8+Math.random()*0.8,0,Math.PI*2); ctx.fill();
      }

      // Moon
      ctx.fillStyle='rgba(240,240,220,0.9)';
      ctx.beginPath(); ctx.arc(W*0.8,H*0.1,W*0.055,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#1a3a5c';
      ctx.beginPath(); ctx.arc(W*0.82,H*0.09,W*0.045,0,Math.PI*2); ctx.fill();

      // Aurora hints
      for(let i=0;i<3;i++){
        const ag=ctx.createLinearGradient(0,H*(0.1+i*0.05),0,H*(0.25+i*0.05));
        ag.addColorStop(0,`rgba(80,200,140,${0.06-i*0.015})`);
        ag.addColorStop(1,'rgba(80,200,140,0)');
        ctx.fillStyle=ag; ctx.fillRect(0,H*(0.1+i*0.05),W,H*0.15);
      }

      // Snow ground
      const snow=ctx.createLinearGradient(0,H*0.55,0,H);
      snow.addColorStop(0,'#dce8f0'); snow.addColorStop(0.4,'#b8ccd8'); snow.addColorStop(1,'#8aabb8');
      ctx.fillStyle=snow; ctx.fillRect(0,H*0.55,W,H*0.45);

      // Far mountains
      function mountain(pts,col){
        ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(pts[0][0],H);
        pts.forEach(p=>ctx.lineTo(p[0],p[1]));
        ctx.lineTo(pts[pts.length-1][0],H); ctx.closePath(); ctx.fill();
      }
      mountain([[0,H*0.6],[W*0.15,H*0.3],[W*0.28,H*0.48],[W*0.42,H*0.25],[W*0.55,H*0.45],[W*0.68,H*0.22],[W*0.82,H*0.42],[W,H*0.35],[W,H]],'#2a3f52');
      mountain([[0,H*0.72],[W*0.12,H*0.45],[W*0.25,H*0.6],[W*0.4,H*0.38],[W*0.52,H*0.55],[W*0.65,H*0.35],[W*0.78,H*0.52],[W,H*0.42],[W,H]],'#3a5268');
      mountain([[0,H*0.82],[W*0.18,H*0.55],[W*0.35,H*0.72],[W*0.5,H*0.48],[W*0.65,H*0.65],[W*0.82,H*0.52],[W,H*0.62],[W,H]],'#5a7a8e');

      // Snow caps
      ctx.fillStyle='rgba(240,248,255,0.9)';
      function snowCap(px,py,w){
        ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px-w,py+H*0.06); ctx.lineTo(px+w,py+H*0.06); ctx.closePath(); ctx.fill();
      }
      snowCap(W*0.15,H*0.3,W*0.07); snowCap(W*0.42,H*0.25,W*0.08); snowCap(W*0.68,H*0.22,W*0.08);

      // Pine trees silhouette
      ctx.fillStyle='#1a2e1a';
      for(let i=0;i<14;i++){
        const tx=W*(i/13), ty=H*0.68+Math.random()*H*0.06, th=H*(0.08+Math.random()*0.08);
        ctx.beginPath(); ctx.moveTo(tx,ty-th); ctx.lineTo(tx-th*0.3,ty); ctx.lineTo(tx+th*0.3,ty); ctx.closePath(); ctx.fill();
        ctx.fillRect(tx-2,ty,4,th*0.2);
      }

      // Foreground snow ripples
      ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1;
      for(let i=0;i<5;i++){
        const ry=H*(0.82+i*0.04);
        ctx.beginPath(); ctx.moveTo(0,ry);
        for(let x=0;x<=W;x+=W/5) ctx.quadraticCurveTo(x+W/10,ry-3,x+W/5,ry);
        ctx.stroke();
      }
    }
  },
];

// ── Game State ─────────────────────────────────────────────
let currentScene = 0;
let numPieces = 9;
let COLS, ROWS, PIECE_W, PIECE_H;
const BOARD_SIZE = 420;

let pieces = [];       // { id, correctCol, correctRow, placed, el, canvas }
let placedGrid = {};   // "col,row" -> pieceId
let moves = 0;
let startTime, timerInterval;
let hintVisible = false;
let dragging = null;   // { pieceId, offsetX, offsetY }
let sourceCell = null;

const board = document.getElementById('puzzleBoard');
const tray  = document.getElementById('pieceTray');
const ghost = document.getElementById('dragGhost');
const ghostCv= document.getElementById('ghostCanvas');

// ── Scene image ────────────────────────────────────────────
let sceneCanvas;

function buildSceneCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width=w; c.height=h;
  SCENES[currentScene].paint(c.getContext('2d'), w, h);
  return c;
}

function selectScene(idx, btn) {
  currentScene = idx;
  document.querySelectorAll('.controls-bar .pill-btn').forEach(b => {
    if(['Sunset','Forest','Ocean','Mountain'].includes(b.textContent)) b.classList.remove('active');
  });
  btn.classList.add('active');
}

function selectDiff(n, btn) {
  numPieces = n;
  ['d9','d16','d25'].forEach(id=>document.getElementById(id).classList.remove('active'));
  btn.classList.add('active');
}

// ── Build game ─────────────────────────────────────────────
function newGame() {
  clearInterval(timerInterval);
  moves = 0; hintVisible = false;
  placedGrid = {};
  dragging = null;

  COLS = Math.sqrt(numPieces);
  ROWS = COLS;
  PIECE_W = Math.floor(BOARD_SIZE / COLS);
  PIECE_H = PIECE_W;

  const totalW = PIECE_W * COLS;
  const totalH = PIECE_H * ROWS;

  sceneCanvas = buildSceneCanvas(totalW, totalH);

  // Preview
  const prev = document.getElementById('previewCanvas');
  prev.width = 136; prev.height = 136;
  const pc = prev.getContext('2d');
  pc.drawImage(sceneCanvas, 0, 0, 136, 136);

  // Build board grid
  board.style.gridTemplateColumns = `repeat(${COLS}, ${PIECE_W}px)`;
  board.style.gridTemplateRows    = `repeat(${ROWS}, ${PIECE_H}px)`;
  board.style.gap = '3px';
  board.innerHTML = '';

  for (let r=0;r<ROWS;r++) {
    for (let c=0;c<COLS;c++) {
      const cell = document.createElement('div');
      cell.className = 'puzzle-cell';
      cell.dataset.col = c; cell.dataset.row = r;
      cell.style.width  = PIECE_W+'px';
      cell.style.height = PIECE_H+'px';
      board.appendChild(cell);
      setupCellDrop(cell);
    }
  }

  // Build pieces
  pieces = [];
  tray.innerHTML = '';

  const ids = Array.from({length: numPieces}, (_,i)=>i).sort(()=>Math.random()-0.5);

  ids.forEach(id => {
    const col = id % COLS;
    const row = Math.floor(id / COLS);
    const pCanvas = document.createElement('canvas');
    pCanvas.width  = PIECE_W;
    pCanvas.height = PIECE_H;
    const pCtx = pCanvas.getContext('2d');
    pCtx.drawImage(sceneCanvas, col*PIECE_W, row*PIECE_H, PIECE_W, PIECE_H, 0, 0, PIECE_W, PIECE_H);

    // Border
    pCtx.strokeStyle='rgba(255,255,255,0.25)'; pCtx.lineWidth=2;
    pCtx.strokeRect(1,1,PIECE_W-2,PIECE_H-2);

    const wrap = document.createElement('div');
    wrap.className = 'piece-wrap';
    wrap.dataset.id = id;
    wrap.appendChild(pCanvas);
    tray.appendChild(wrap);

    const piece = { id, correctCol:col, correctRow:row, placed:false, el:wrap, canvas:pCanvas };
    pieces.push(piece);
    setupPieceDrag(wrap, piece);
  });

  updateStats();
  updateProgress();
  startTimer();
}

// ── Timer ──────────────────────────────────────────────────
function startTimer() {
  startTime = Date.now();
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimerDisplay, 1000);
}

function updateTimerDisplay() {
  const elapsed = Math.floor((Date.now()-startTime)/1000);
  const m = Math.floor(elapsed/60), s = elapsed%60;
  document.getElementById('timeVal').textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

function getElapsedStr() {
  const elapsed = Math.floor((Date.now()-startTime)/1000);
  const m = Math.floor(elapsed/60), s = elapsed%60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

// ── Drag & Drop ────────────────────────────────────────────
function setupPieceDrag(el, piece) {
  // Mouse
  el.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY, piece, el));
  // Touch
  el.addEventListener('touchstart', e => {
    const t = e.touches[0];
    startDrag(t.clientX, t.clientY, piece, el);
  }, { passive:true });
}

function startDrag(cx2, cy, piece, el) {
  if (piece.placed) {
    // Allow re-dragging from board
    const cellKey = `${piece.correctCol},${piece.correctRow}`;
    // find where it actually is
    for (const [k, pid] of Object.entries(placedGrid)) {
      if (pid === piece.id) {
        delete placedGrid[k];
        const [c,r] = k.split(',').map(Number);
        const cell = getCellEl(c,r);
        if (cell) { cell.innerHTML=''; cell.classList.remove('filled','correct'); }
        piece.placed = false;
        break;
      }
    }
  }
  piece.el.classList.add('dragging');
  dragging = { piece };

  // Setup ghost
  ghostCv.width  = PIECE_W;
  ghostCv.height = PIECE_H;
  ghostCv.getContext('2d').drawImage(piece.canvas, 0, 0);
  ghost.style.display = 'block';
  ghost.style.left = cx2+'px';
  ghost.style.top  = cy+'px';

  updateProgress();
  updateStats();
}

document.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
document.addEventListener('touchmove', e => {
  const t = e.touches[0];
  moveDrag(t.clientX, t.clientY);
}, { passive: true });

function moveDrag(cx2, cy) {
  if (!dragging) return;
  ghost.style.left = cx2+'px';
  ghost.style.top  = cy+'px';

  // Highlight target cell
  document.querySelectorAll('.puzzle-cell').forEach(c=>c.classList.remove('hover-target'));
  const el = document.elementFromPoint(cx2, cy);
  const cell = el?.closest('.puzzle-cell');
  if (cell && !placedGrid[`${cell.dataset.col},${cell.dataset.row}`]) {
    cell.classList.add('hover-target');
  }
}

document.addEventListener('mouseup', e => endDrag(e.clientX, e.clientY));
document.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  endDrag(t.clientX, t.clientY);
}, { passive: true });

function endDrag(cx2, cy) {
  if (!dragging) return;
  ghost.style.display = 'none';
  document.querySelectorAll('.puzzle-cell').forEach(c=>c.classList.remove('hover-target'));

  const el = document.elementFromPoint(cx2, cy);
  const cell = el?.closest('.puzzle-cell');

  if (cell) {
    const col = parseInt(cell.dataset.col);
    const row = parseInt(cell.dataset.row);
    const key = `${col},${row}`;
    if (!placedGrid[key]) {
      placePiece(dragging.piece, col, row, cell);
    } else {
      returnToTray(dragging.piece);
    }
  } else {
    returnToTray(dragging.piece);
  }

  dragging.piece.el.classList.remove('dragging');
  dragging = null;
}

function placePiece(piece, col, row, cell) {
  placedGrid[`${col},${row}`] = piece.id;
  piece.placed = true;
  moves++;

  // Clone canvas into cell
  const mini = document.createElement('canvas');
  mini.width  = PIECE_W;
  mini.height = PIECE_H;
  mini.getContext('2d').drawImage(piece.canvas, 0, 0);
  mini.style.display='block';
  mini.style.borderRadius='3px';
  mini.dataset.pieceId = piece.id;
  cell.innerHTML = '';
  cell.appendChild(mini);
  cell.classList.add('filled');

  const correct = (col === piece.correctCol && row === piece.correctRow);
  if (correct) { cell.classList.add('correct'); }

  // Remove from tray
  if (piece.el.parentNode === tray) tray.removeChild(piece.el);

  updateStats();
  updateProgress();
  checkWin();
}

function returnToTray(piece) {
  piece.placed = false;
  piece.el.classList.remove('dragging');
  if (piece.el.parentNode !== tray) tray.appendChild(piece.el);
}

function setupCellDrop(cell) {
  // Allow clicking placed piece to send back to tray
  cell.addEventListener('click', e => {
    const key = `${cell.dataset.col},${cell.dataset.row}`;
    const pid = placedGrid[key];
    if (pid !== undefined && !dragging) {
      const piece = pieces.find(p=>p.id===pid);
      if (piece) {
        delete placedGrid[key];
        cell.innerHTML='';
        cell.classList.remove('filled','correct');
        piece.placed = false;
        tray.appendChild(piece.el);
        updateStats(); updateProgress();
      }
    }
  });
}

function getCellEl(col, row) {
  return board.querySelector(`[data-col="${col}"][data-row="${row}"]`);
}

// ── Hint ───────────────────────────────────────────────────
function toggleHint() {
  hintVisible = !hintVisible;
  // Show ghost image on board
  const boardFrame = board;
  let hintEl = document.getElementById('hintImg');
  if (hintVisible) {
    if (!hintEl) {
      hintEl = document.createElement('canvas');
      hintEl.id = 'hintImg';
      hintEl.width  = PIECE_W*COLS;
      hintEl.height = PIECE_H*ROWS;
      hintEl.style.cssText = `position:absolute;inset:0;width:100%;height:100%;opacity:0.25;pointer-events:none;z-index:5;border-radius:6px;`;
      hintEl.getContext('2d').drawImage(sceneCanvas, 0, 0);
      board.parentElement.style.position='relative';
      board.parentElement.appendChild(hintEl);
    } else { hintEl.style.display='block'; }
  } else {
    if (hintEl) hintEl.style.display='none';
  }
}

// ── Stats & Progress ───────────────────────────────────────
function updateStats() {
  document.getElementById('movesVal').textContent = moves;
  const remaining = pieces.filter(p=>!p.placed).length;
  document.getElementById('leftVal').textContent = remaining;
}

function updateProgress() {
  const placed = Object.keys(placedGrid).length;
  const pct = (placed / numPieces) * 100;
  document.getElementById('progressBar').style.width = pct+'%';
}

// ── Win ────────────────────────────────────────────────────
function checkWin() {
  const allCorrect = pieces.every(p => {
    if (!p.placed) return false;
    for (const [k,pid] of Object.entries(placedGrid)) {
      if (pid===p.id) {
        const [c,r]=k.split(',').map(Number);
        return c===p.correctCol && r===p.correctRow;
      }
    }
    return false;
  });
  if (allCorrect) {
    clearInterval(timerInterval);
    setTimeout(() => {
      document.getElementById('winMoves').textContent = moves;
      document.getElementById('winTime').textContent  = getElapsedStr();
      document.getElementById('winOverlay').classList.add('show');
      launchConfetti();
    }, 300);
  }
}

function closeWin() {
  document.getElementById('winOverlay').classList.remove('show');
  newGame();
}

function launchConfetti() {
  const colors = ['#c9973a','#e8612a','#5db8d4','#2d6b1a','#b8cfe0','#f5c842','#e63946'];
  for (let i=0;i<60;i++) {
    setTimeout(()=>{
      const c = document.createElement('div');
      c.className='confetti-piece';
      c.style.cssText=`left:${Math.random()*100}vw;top:0;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.5}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;`;
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),3000);
    }, i*30);
  }
}

// ── Init ───────────────────────────────────────────────────
newGame();
</script>
